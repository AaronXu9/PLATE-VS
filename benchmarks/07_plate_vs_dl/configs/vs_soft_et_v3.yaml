# PLATE-VS — SOFT split, TorchMD-NET ET (v3: bug fixed at data level)
# See vs_hard_et_v3.yaml header for the diagnosis. Uses original aggressive HP.

data:
  registry_path: "../../../training_data_full/registry_soft_split.csv"
  protein_emb_path: "../../../data/plate_vs_protein_embeddings/esm2_embeddings.npz"
  conformer_path: "../../../data/plate_vs_conformers/conformers_full.pkl"
  similarity_threshold: "0p7"
  split_column: "protein_partition"
  include_decoys: true
  max_decoys_per_target: 100
  batch_size: 32
  num_workers: 0
  max_pocket_residues: 80
  max_ligand_atoms: 80

model:
  esm_dim: 320
  proj_dim: 256
  et_layers: 6
  et_heads: 8
  et_rbf: 64
  et_cutoff: 10.0
  cross_attn_layers: 3
  cross_attn_heads: 8
  dropout: 0.15
  ligand_backend: "torchmd_et"

loss:
  type: "bce"
  pos_weight: 1.0

training:
  lr: 1.0e-4
  weight_decay: 1.0e-5
  warmup_steps: 2000
  max_epochs: 30
  patience: 10
  grad_clip: 0.5
  seed: 42

wandb:
  enabled: true
  project: "plate-vs-dl"
  entity: null
  tags: ["plate-vs", "virtual-screening", "torchmd_et", "0p7", "soft-split", "carc", "v3-data-fix"]

output:
  results_dir: "./results"
  checkpoint_dir: "./checkpoints_soft_et_v3"
