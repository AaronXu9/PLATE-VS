# PLATE-VS — HARD split, TorchMD-NET ET (v2: conservative, NaN-stable)
#
# v1 produced NaN loss from epoch 1. v2 changes vs v1:
#   - et_layers:    6     -> 4   (match SchNet depth, less stacked attention)
#   - lr:           1e-4  -> 3e-5
#   - warmup_steps: 2000  -> 4000
#   - grad_clip:    0.5   -> 0.1   (much tighter)
#   - dropout:      0.15  -> 0.20
# train_vs.py also now skips NaN batches automatically.

data:
  registry_path: "../../../training_data_full/registry_2d_split.csv"
  protein_emb_path: "../../../data/plate_vs_protein_embeddings/esm2_embeddings.npz"
  conformer_path: "../../../data/plate_vs_conformers/conformers_full.pkl"
  similarity_threshold: "0p7"
  include_decoys: true
  max_decoys_per_target: 100
  batch_size: 32
  num_workers: 0
  max_pocket_residues: 80
  max_ligand_atoms: 80

model:
  esm_dim: 320
  proj_dim: 256
  et_layers: 4                    # was 6
  et_heads: 8
  et_rbf: 64
  et_cutoff: 10.0
  cross_attn_layers: 3
  cross_attn_heads: 8
  dropout: 0.20                   # was 0.15
  ligand_backend: "torchmd_et"

loss:
  type: "bce"
  pos_weight: 1.0

training:
  lr: 3.0e-5                      # was 1.0e-4
  weight_decay: 1.0e-5
  warmup_steps: 4000              # was 2000
  max_epochs: 30
  patience: 10
  grad_clip: 0.1                  # was 0.5
  seed: 42

wandb:
  enabled: true
  project: "plate-vs-dl"
  entity: null
  tags: ["plate-vs", "virtual-screening", "torchmd_et", "0p7", "hard-split", "carc", "v2-conservative"]

output:
  results_dir: "./results"
  checkpoint_dir: "./checkpoints_hard_et_v2"
